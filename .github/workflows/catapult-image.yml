name: catapult-image (build / publish)

# Nemtus-owned workflow that builds the self-contained catapult-server container image
# and, on a release tag, publishes it to GHCR.
#
# The Dockerfile is GENERATED by .github/scripts/gen-catapult-dockerfile.sh, not
# committed. Stages 1-4 of it are upstream symbol/symbol's own compiler and dependency
# build, taken verbatim from jenkins/catapult, so upstream's OS release, compiler
# version, dependency versions and install locations are FOLLOWED rather than
# re-derived. The only value nemtus fixes is the target architecture, in
# .github/catapult/compiler-amd64.yaml.
#
# The image is still built WITHOUT any upstream implicit asset: every upstream layer's
# FROM is rewritten to the preceding stage, so no symbolplatform/* image is pulled, and
# no conan.symbol.dev remote is used. The generation step asserts both.
#
# This replaced a hand-written Dockerfile that reimplemented the dependency build and
# then flattened each dependency's prefix into one directory. That encoded a layout
# assumption which broke silently when upstream moved OpenSSL 3 -> 4, shipping an image
# whose every binary exited 127. Following upstream's own build removes the assumption.
#
# IMPORTANT (mirror): this workflow is in the `nemtus_workflows` allow-list in
# .github/scripts/apply-nemtus-patch.sh, so mirror-sync does NOT strip it. If you
# rename this file, update that allow-list too (mirror-ci enforces no-drift).
#
# Supply-chain posture: we deliberately use NO third-party marketplace actions here
# (only the already-pinned actions/checkout). The build runs via the runner's
# preinstalled `docker buildx`, with SBOM + provenance attestations attached
# natively by buildx on publish.
#
# Triggers:
#   - pull_request touching the catapult build inputs -> build + smoke-test ONLY
#     (never pushes an image).
#   - push of a tag `catapult-image-v*` -> build + PUBLISH to GHCR (+ SBOM/provenance).
#   - workflow_dispatch -> build; push only when `push=true` is selected, optionally
#     REBUILDING an already-released version via `release_tag` (see below).
#
# SECURITY REBUILDS (`release_tag`):
# A published image rots even when upstream ships nothing: its baked Ubuntu layers stop
# receiving patches the moment it is built. Dispatching with
# `release_tag: catapult-image-v1.0.3.9` (plus `push: true`) checks out THAT tag —
# byte-identical upstream source — and rebuilds it, so the Dockerfile's `apt-get update`
# picks up everything published since. Zero divergence from upstream; only base layers move.
#
# Tagging for a rebuild is deliberate:
#   - `:v1.0.3.9`            MOVES to the rebuild. This is what versions.env in
#                            nemtus/symbol-networks pins, so `docker compose pull`
#                            downstream picks the patched image up with no cross-repo
#                            change. Moving a version tag to a patched rebuild of the
#                            same source is the container-ecosystem norm; the immutable
#                            identifier is the digest.
#   - `:latest`              MOVES, as on a normal release.
#   - `:v1.0.3.9-YYYYMMDD`   NEW, and never moves — a permanent handle for this exact
#                            rebuild. upstream-release-watch.yml filters tags through
#                            `^[0-9]+(\.[0-9]+)*$` after stripping the prefix, so a dated
#                            tag is invisible to it and cannot trip its comparisons.
#   - `:sha-<sha>`           moves (same commit, newest build of it).
#
# Without `release_tag`, a dispatch publishes ONLY `:sha-<sha>` even with `push=true`:
# `:<ref_name>` / `:latest` must never point at an unreleased build.
#
# Publishing posture: catapult is published as a PUBLIC image. The gate is fully
# automated and the licensing evidence is recorded automatically — no per-release
# manual step while the gate is green:
#   1. check-license-scope.sh hard-blocks the build if any Tech Bureau Commercial-
#      licensed file is present (dual-license clause in client/catapult/LICENSE.txt).
#      It runs both as an explicit step here AND inside the Dockerfile, which bundles
#      its PASS report into the image at /opt/catapult/licenses/LICENSE-SCOPE-REPORT.txt.
#   2. buildx attaches an SBOM + SLSA provenance attestation to the pushed image.
#   3. the "Record publish evidence" step writes revision/digest/result to the run
#      summary (durable, automatic).
# A human only intervenes in the EXCEPTION case where the gate fails — see
# client/catapult/docs/PUBLISHING-COMPLIANCE.md. GHCR package visibility is a ONE-TIME
# setup (first publish creates a private package; flip it to public once, then every
# release stays public automatically).

on:
  pull_request:
    paths:
      - 'client/catapult/**'
      - 'jenkins/catapult/**'          # upstream's dependency build — stages 1-4
      - '.github/catapult/**'          # the one value nemtus fixes (architecture)
      - '.github/scripts/gen-catapult-dockerfile.sh'
      - '.dockerignore'
      - '.github/workflows/catapult-image.yml'
  push:
    tags:
      - 'catapult-image-v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the image to GHCR'
        type: boolean
        default: false
      release_tag:
        description: 'Security rebuild: existing release tag to rebuild (e.g. catapult-image-v1.0.3.9). Empty = build the dispatched ref, publishing only :sha-<sha>.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Keyed on the rebuild target when there is one, so two rebuilds of the same release
  # cannot race to move :v<version> / :latest.
  group: catapult-image-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the push step below
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/catapult-server
    steps:
      # The from-source dependency build is disk-hungry; reclaim space the runner
      # spends on preinstalled toolchains we don't need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a security rebuild, build the RELEASED source, not the dispatched ref.
          # The workflow logic still comes from the dispatched ref (this file), which is
          # what we want: current build/publish logic, byte-identical upstream source.
          ref: ${{ inputs.release_tag || github.ref }}
          # This workflow authenticates to GHCR with GITHUB_TOKEN via docker login,
          # not git, so don't persist credentials into the local git config.
          persist-credentials: false

      # Licensing gate: fail if the source carries any Tech Bureau Commercial-licensed
      # file (dual-license clause in client/catapult/LICENSE.txt). On a PR this is just a
      # visible red check (keep it OUT of the dev branch-protection required checks so it
      # never blocks the verbatim SDK mirror sync); on a publish run it runs BEFORE the
      # push steps, so a failure here makes publishing a non-LGPL image impossible.
      - name: License-scope check (no commercial-licensed files)
        run: bash client/catapult/scripts/check-license-scope.sh

      # The Dockerfile is GENERATED, not committed: stages 1-4 are upstream's own
      # compiler + dependency build (jenkins/catapult), so upstream's OS release,
      # compiler version, dependency versions and install locations arrive by following
      # upstream rather than by us re-deriving them. A committed copy would freeze those
      # values until someone regenerated it, which is the drift this replaces.
      #
      # PyYAML is what upstream's configuration loader needs; apt rather than pip because
      # Ubuntu's system python is PEP 668 externally-managed.
      - name: Install generator prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Generate Dockerfile from upstream's dependency layers
        id: gen
        run: |
          bash .github/scripts/gen-catapult-dockerfile.sh --out /tmp/Dockerfile.catapult --summary /tmp/catapult-inputs.md
          # A leaked symbolplatform/* reference would mean a stage is being PULLED from
          # Docker Hub instead of built here — the one thing this image must never do.
          if grep -q 'symbolplatform' /tmp/Dockerfile.catapult; then
            echo "::error::generated Dockerfile still references symbolplatform/*; a stage would be pulled from Docker Hub." >&2
            grep -n 'symbolplatform' /tmp/Dockerfile.catapult >&2
            exit 1
          fi
          # Everything except the two ubuntu base images must be an internal stage.
          if grep -E '^FROM ' /tmp/Dockerfile.catapult | grep -vqE '^FROM (ubuntu:[0-9.]+|compiler|preimage[123])( AS .*)?$'; then
            echo "::error::unexpected external FROM in the generated Dockerfile:" >&2
            grep -E '^FROM ' /tmp/Dockerfile.catapult >&2
            exit 1
          fi
          {
            echo "## catapult image build inputs"
            echo ''
            cat /tmp/catapult-inputs.md
            echo ''
            echo '<details><summary>generated Dockerfile</summary>'
            echo ''
            echo '```dockerfile'
            cat /tmp/Dockerfile.catapult
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide push + tags
        id: meta
        run: |
          push=false
          if [ "${{ github.event_name }}" = "push" ]; then push=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" = "true" ]; then push=true; fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"

          # A rebuild names its target explicitly; otherwise fall back to the pushed ref.
          ref="${{ inputs.release_tag || github.ref_name }}"
          sha="$(git rev-parse --short HEAD)"
          echo "vcs_ref=${sha}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE}:sha-${sha}"

          if [ "${ref#catapult-image-}" = "${ref}" ]; then
            # Not a release tag (PR, or a plain dispatch from `dev`). Only the
            # commit-addressed tag — never :<ref_name> / :latest for an unreleased build.
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${ref#catapult-image-}"   # tag catapult-image-v1.2.3 -> v1.2.3
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${push}" = "true" ]; then
            tags="${tags},${IMAGE}:${version},${IMAGE}:latest"
            if [ -n "${{ inputs.release_tag }}" ]; then
              # Immutable per-rebuild handle alongside the moving :<version>. Dated rather
              # than a counter so it needs no state, and it is filtered out by
              # upstream-release-watch.yml's `^[0-9]+(\.[0-9]+)*$` tag filter.
              stamp="$(date -u +%Y%m%d)"
              tags="${tags},${IMAGE}:${version}-${stamp}"
              echo "rebuild=${version}-${stamp}" >> "$GITHUB_OUTPUT"
              echo "::notice::Security rebuild of ${ref} (source ${sha}): moving :${version} and :latest, recording :${version}-${stamp}."
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx (docker-container driver for registry cache)
        run: docker buildx create --use --name nemtus --driver docker-container

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # PR / non-push: build and load locally so we can smoke-test the artifact.
      #
      # `--pull`: without it buildx may reuse an already-resolved `ubuntu:<X>` instead of
      # re-checking the registry, silently pinning the image to whatever base was seen
      # first rather than tracking it.
      #
      # This build also WRITES the GitHub Actions cache, which it did not before: a verify
      # build populated nothing, so every iteration paid the full from-source C++ compile
      # even when the change was seconds of shell. `type=gha` rather than the registry
      # cache because GitHub scopes it per branch, so a PR cannot write anything the
      # publish path reads.
      - name: Build (verify, no push)
        if: steps.meta.outputs.push != 'true'
        run: |
          docker buildx build \
            -f /tmp/Dockerfile.catapult \
            --pull \
            --build-arg "VCS_REF=${{ steps.meta.outputs.vcs_ref }}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-from "type=gha,scope=catapult-image" \
            --cache-to "type=gha,scope=catapult-image,mode=max" \
            -t "${IMAGE}:ci" \
            --load \
            .

      - name: Smoke test (toolchain runs)
        if: steps.meta.outputs.push != 'true'
        run: |
          docker run --rm --entrypoint catapult.tools.addressgen "${IMAGE}:ci" --count 1
          docker run --rm --entrypoint sh "${IMAGE}:ci" -c 'ls /opt/catapult/licenses'

      # Release tag / dispatch-with-push: publish to GHCR with SBOM + provenance, and
      # warm the registry build cache for future runs. The in-Dockerfile license-scope
      # gate also runs here, so a non-LGPL tree cannot produce a pushed image.
      #
      # A SECURITY REBUILD MUST NOT USE THE CACHE. Its whole purpose is to pick up base
      # image and OS package updates for source that has NOT changed — and "source has not
      # changed" is exactly the condition under which every layer, `apt-get update &&
      # apt-get install` included, is a cache hit. With the cache on, rebuilding
      # catapult-image-v1.0.3.9 would reproduce the identical image, apply no patches at
      # all, move :v1.0.3.9 and :latest onto it, and report success.
      #
      # A normal release keeps the cache: its source differs, so the layers that matter
      # rebuild anyway, and --pull still re-resolves the base image.
      - name: Build and publish (GHCR)
        if: steps.meta.outputs.push == 'true'
        run: |
          cache_args='--cache-from type=registry,ref='"${IMAGE}"':buildcache --cache-to type=registry,ref='"${IMAGE}"':buildcache,mode=max'
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "::notice::security rebuild of ${{ inputs.release_tag }} — building with --no-cache so base image and OS updates are actually applied."
            cache_args='--no-cache'
          fi
          # shellcheck disable=SC2086  # cache_args is a deliberate word-split argument list
          docker buildx build \
            -f /tmp/Dockerfile.catapult \
            --pull \
            ${cache_args} \
            --build-arg "VCS_REF=${{ steps.meta.outputs.vcs_ref }}" \
            --provenance=true --sbom=true \
            --metadata-file /tmp/build-meta.json \
            $(printf -- '-t %s ' $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' ')) \
            --push \
            .

      # Automated evidence: no manual sign-off while the gate is green. This record is
      # retained with the workflow run; the same PASS report is also bundled inside the
      # image and an SBOM/provenance attestation is attached to it in the registry.
      - name: Record publish evidence
        if: steps.meta.outputs.push == 'true'
        run: |
          digest="$(jq -r '."containerimage.digest" // "unknown"' /tmp/build-meta.json 2>/dev/null || echo unknown)"
          {
            echo "## catapult-server image published"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| digest | \`${digest}\` |"
            # The built commit, which on a security rebuild is the RELEASE TAG's commit,
            # not github.sha (that is the dispatched ref, i.e. dev).
            echo "| source revision | \`${{ steps.meta.outputs.vcs_ref }}\` |"
            if [ -n "${{ inputs.release_tag }}" ]; then
              echo "| security rebuild of | \`${{ inputs.release_tag }}\` — upstream source unchanged, base layers refreshed |"
              echo "| immutable rebuild tag | \`${{ steps.meta.outputs.rebuild }}\` |"
            fi
            echo "| license-scope gate | PASSED (also bundled in image at /opt/catapult/licenses/LICENSE-SCOPE-REPORT.txt) |"
            echo "| attestations | SBOM + SLSA provenance attached via buildx |"
            echo "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Published ${IMAGE} @ ${digest}"

      # GHCR creates a PRIVATE package on first push; making it public is a ONE-TIME
      # setting in the package UI (Package settings -> Change visibility -> Public),
      # not a per-release action. After that, every release stays public automatically.
      # (No REST endpoint flips container-package visibility, so this is a reminder, not
      # an automated step — it only surfaces until the package is already public.)
      - name: Package-visibility reminder (one-time)
        if: steps.meta.outputs.push == 'true'
        run: |
          echo "::notice::If ghcr.io/${{ github.repository_owner }}/catapult-server is still PRIVATE,"
          echo "::notice::set it to Public once in the package settings; later releases stay public automatically."
