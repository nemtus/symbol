name: rest-image (build / publish)

# Nemtus-owned workflow that builds the client/rest (symbol-api-rest) container image
# from client/rest/Dockerfile.nemtus and, on a release tag, publishes it to GHCR as
# ghcr.io/nemtus/symbol-rest. This mirrors the upstream client/rest build (Ubuntu +
# Node from NodeSource, `npm install --omit=dev`) plus the nemtus publishing layer.
#
# IMPORTANT (mirror): this workflow is in the `nemtus_workflows` allow-list in
# .github/scripts/apply-nemtus-patch.sh, so mirror-sync does NOT strip it. If you
# rename this file, update that allow-list too (mirror-ci enforces no-drift).
#
# Supply-chain posture: NO third-party marketplace actions (only the already-pinned
# actions/checkout); the build runs via the runner's preinstalled `docker buildx`.
# Least privilege: the `build` job (which runs on PRs, i.e. on untrusted mirror-sync
# input) is `contents: read` only. `packages: write` lives solely in the `publish` job,
# which runs only on a release tag / dispatch-with-push.
#
# Triggers:
#   - pull_request touching client/rest -> build + smoke-test ONLY (read-only token).
#   - push of a tag `rest-image-v*` -> publish to GHCR (+ SBOM/provenance), then create
#     the GitHub Release (`release` job).
#   - workflow_dispatch -> build (push=false) or publish (push=true), optionally
#     REBUILDING an already-released version via `release_tag` (see below).
#
# SECURITY REBUILDS (`release_tag`):
# A published image rots even when upstream ships nothing: its baked Ubuntu and
# NodeSource layers stop receiving patches the moment it is built. Dispatching with
# `release_tag: rest-image-v2.5.1` checks out THAT tag — byte-identical upstream source —
# and rebuilds it, so `apt-get update && apt-get upgrade -y` in the Dockerfile picks up
# everything published since. Zero divergence from upstream; only the base layers move.
#
# Tags of every release publish (first publish and each rebuild alike):
#   - `:v2.5.1-YYYYMMDD`   NEW, and never moves — the immutable handle for this exact
#                          build, so "which base did v2.5.1 have in October" stays
#                          answerable. This is what versions.env in nemtus/symbol-networks
#                          pins (a moved mutable tag never reaches nodes that already
#                          cached it). A publish whose dated tag already exists — a second
#                          one on the same UTC day — FAILS before building.
#                          upstream-release-watch.yml filters tags through
#                          `^[0-9]+(\.[0-9]+)*$` after stripping the prefix, so a dated
#                          tag is invisible to it and cannot trip its pin/version
#                          comparisons.
#   - `:v2.5.1`            MOVES to the newest build of that version. Moving a version tag
#                          to a patched rebuild of the same source is the
#                          container-ecosystem norm (official images do it); the immutable
#                          identifier is the digest (and the dated tag).
#   - `:latest`            MOVES.
#   - `:sha-<sha>`         moves (same commit, newest build of it).
# The `release` job then records the build in the GitHub Release `rest-image-v<Y>`: a
# first publish creates it, a rebuild appends a row to its Builds table
# (.github/scripts/image-release.sh).
#
# Without `release_tag`, a dispatch builds the dispatched ref and publishes ONLY
# `:sha-<sha>`, and no Release is touched. It must never publish `:<ref_name>` /
# `:latest`: dispatching from `dev` used to tag the image `:dev` and clobber `:latest`
# with an unreleased build.
#
# Publishing posture: symbol-rest is published as a PUBLIC image. The license-scope gate
# is automated and the evidence is recorded automatically — no per-release manual step
# while the gate is green. See client/rest/docs/PUBLISHING-COMPLIANCE.md. GHCR package
# visibility is a ONE-TIME setup (first publish creates a private package; flip it to
# public once — the org must also allow public packages — then releases stay public).

on:
  pull_request:
    paths:
      - 'client/rest/**'
      - '.github/workflows/rest-image.yml'
  push:
    tags:
      - 'rest-image-v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the image to GHCR'
        type: boolean
        default: false
      release_tag:
        description: 'Security rebuild: existing release tag to rebuild (e.g. rest-image-v2.5.1). Empty = build the dispatched ref, publishing only :sha-<sha>.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Keyed on the rebuild target when there is one, so two rebuilds of the same release
  # cannot race to move :v<version> / :latest.
  group: rest-image-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  # Build + smoke test only. Read-only token (NO packages:write), so a malicious PR
  # cannot reach the registry. Runs on PRs and on a dispatch that is not publishing.
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.push != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/symbol-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Licensing gate: fail if the source carries any Tech Bureau Commercial-licensed
      # file (dual-license clause in client/rest/LICENSE.txt). Keep this OUT of the dev
      # branch-protection required checks so it never blocks the verbatim SDK mirror sync.
      - name: License-scope check (no commercial-licensed files)
        run: bash client/rest/scripts/check-license-scope.sh

      - name: Set up buildx
        run: docker buildx create --use --name nemtus --driver docker-container

      - name: Build (verify, no push)
        run: |
          sha="$(git rev-parse --short HEAD)"
          # --pull: without it buildx may reuse an already-resolved `ubuntu:<X>` rather
          # than re-checking the registry, which would silently pin this image to
          # whatever base was seen first instead of tracking it.
          docker buildx build \
            -f client/rest/Dockerfile.nemtus \
            --pull \
            --build-arg "VCS_REF=${sha}" \
            --build-arg "IMAGE_VERSION=${{ github.ref_name }}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            -t "${IMAGE}:ci" \
            --load \
            client/rest

      # The backends (MongoDB / catapult API node / broker) aren't available in CI, so
      # the smoke test syntax-loads each entrypoint and confirms the licenses are bundled.
      - name: Smoke test (entrypoints load, licenses bundled)
        run: |
          docker run --rm "${IMAGE}:ci" --check src/index.js
          docker run --rm "${IMAGE}:ci" --check src/index.light.js
          docker run --rm "${IMAGE}:ci" --check src/index.rosetta.js
          docker run --rm --entrypoint sh "${IMAGE}:ci" -c 'ls /app/licenses && test -f /app/THIRD_PARTY_NOTICES.md'

  # Publish to GHCR. The ONLY job with packages:write, and only on a tag push or a
  # dispatch with push=true. The license-scope gate runs again here (and inside the
  # Dockerfile), so a non-LGPL tree cannot produce a published image.
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Consumed by the `release` job. `dated` is empty unless this run published a release.
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      dated: ${{ steps.meta.outputs.dated }}
      kind: ${{ steps.meta.outputs.kind }}
      vcs_ref: ${{ steps.meta.outputs.vcs_ref }}
      digest: ${{ steps.evidence.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/symbol-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a security rebuild, build the RELEASED source, not the dispatched ref.
          # The workflow logic still comes from the dispatched ref (this file), which is
          # what we want: current build/publish logic, byte-identical upstream source.
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: License-scope check (no commercial-licensed files)
        run: bash client/rest/scripts/check-license-scope.sh

      - name: Decide tags
        id: meta
        run: |
          set -euo pipefail
          # A rebuild names its target explicitly; otherwise fall back to the pushed ref.
          ref="${{ inputs.release_tag || github.ref_name }}"
          sha="$(git rev-parse --short HEAD)"
          echo "vcs_ref=${sha}" >> "$GITHUB_OUTPUT"

          if [ "${ref#rest-image-}" = "${ref}" ]; then
            # Not a release tag (e.g. a plain dispatch from `dev`). Publish ONLY the
            # commit-addressed tag: tagging the image `:dev` and moving `:latest` to an
            # unreleased build is exactly the bug this guard exists to prevent.
            echo "::warning::'${ref}' is not a rest-image-v* release tag; publishing only :sha-${sha}. Pass release_tag to rebuild a release."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:sha-${sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${ref#rest-image-}"   # tag rest-image-v2.5.1 -> v2.5.1
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE}:sha-${sha},${IMAGE}:${version},${IMAGE}:latest"
          # Every publish of a release — the first one (tag push) as well as each security
          # rebuild — also records an IMMUTABLE dated tag next to the moving :<version>.
          # nemtus/symbol-networks versions.env pins that dated tag, so a new release needs
          # no second build just to get one. Dated rather than a counter so it needs no
          # state; filtered out by upstream-release-watch.yml's `^[0-9]+(\.[0-9]+)*$` tag
          # filter. "Refuse to overwrite" below keeps it immutable (a second publish on the
          # same UTC day fails instead).
          stamp="$(date -u +%Y%m%d)"
          tags="${tags},${IMAGE}:${version}-${stamp}"
          echo "dated=${version}-${stamp}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${ref}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "kind=rebuild" >> "$GITHUB_OUTPUT"
            echo "::notice::Security rebuild of ${ref} (source ${sha}): moving :${version} and :latest, recording :${version}-${stamp}."
          else
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${ref} (source ${sha}): publishing :${version}, :latest and :${version}-${stamp}."
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        run: docker buildx create --use --name nemtus --driver docker-container

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The dated tag is the immutable handle downstream pins. Publishing a second build on
      # the same UTC day would silently move it, so fail instead, before building. Re-run
      # on a later UTC day (revisit the scheme if same-day rebuilds become a real need).
      - name: Refuse to overwrite an immutable dated tag
        if: steps.meta.outputs.dated != ''
        env:
          DATED_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.dated }}
        # Inline rather than a script: a rebuild checks out the RELEASED tree, which may
        # predate any helper added later.
        run: |
          if out="$(docker buildx imagetools inspect "${DATED_REF}" 2>&1)"; then
            echo "::error::${DATED_REF} already exists. Dated tags are immutable; publish again on a later UTC day." >&2
            exit 1
          fi
          # Only a definite "not found" means the tag is free; any other failure (registry
          # or auth trouble) must not be mistaken for it.
          if ! printf '%s' "${out}" | grep -qiE 'not found|manifest unknown'; then
            echo "::error::could not determine whether ${DATED_REF} exists:" >&2
            printf '%s\n' "${out}" >&2
            exit 1
          fi
          echo "${DATED_REF} is free."

      # A SECURITY REBUILD MUST NOT USE THE CACHE. Its purpose is to pick up base image
      # and OS/Node package updates for source that has not changed — and "source has not
      # changed" is precisely when every layer, including the apt and NodeSource installs,
      # is a cache hit. With the cache on, a rebuild of rest-image-v2.5.1 would reproduce
      # the identical image and apply no patches, while reporting success.
      #
      # A normal release keeps the cache: its source differs, so the layers that matter
      # rebuild anyway, and --pull still re-resolves the base image.
      - name: Build and publish (GHCR)
        run: |
          cache_args='--cache-from type=registry,ref='"${IMAGE}"':buildcache --cache-to type=registry,ref='"${IMAGE}"':buildcache,mode=max'
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "::notice::security rebuild of ${{ inputs.release_tag }} — building with --no-cache so base image and OS updates are actually applied."
            cache_args='--no-cache'
          fi
          # shellcheck disable=SC2086  # cache_args is a deliberate word-split argument list
          docker buildx build \
            -f client/rest/Dockerfile.nemtus \
            --pull \
            ${cache_args} \
            --build-arg "VCS_REF=${{ steps.meta.outputs.vcs_ref }}" \
            --build-arg "IMAGE_VERSION=${{ steps.meta.outputs.version || format('sha-{0}', steps.meta.outputs.vcs_ref) }}" \
            --provenance=true --sbom=true \
            --metadata-file /tmp/build-meta.json \
            $(printf -- '-t %s ' $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' ')) \
            --push \
            client/rest

      - name: Record publish evidence
        id: evidence
        run: |
          digest="$(jq -r '."containerimage.digest" // "unknown"' /tmp/build-meta.json 2>/dev/null || echo unknown)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## symbol-rest image published"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| digest | \`${digest}\` |"
            # The built commit, which on a security rebuild is the RELEASE TAG's commit,
            # not github.sha (that is the dispatched ref, i.e. dev).
            echo "| source revision | \`${{ steps.meta.outputs.vcs_ref }}\` |"
            if [ -n "${{ inputs.release_tag }}" ]; then
              echo "| security rebuild of | \`${{ inputs.release_tag }}\` — upstream source unchanged, base layers refreshed |"
            fi
            if [ -n "${{ steps.meta.outputs.dated }}" ]; then
              echo "| immutable dated tag | \`${{ steps.meta.outputs.dated }}\` |"
            fi
            echo "| license-scope gate | PASSED (also bundled in image at /app/licenses/LICENSE-SCOPE-REPORT.txt) |"
            echo "| attestations | SBOM + SLSA provenance attached via buildx |"
            echo "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Published ${IMAGE} @ ${digest}"

      - name: Package-visibility reminder (one-time)
        run: |
          echo "::notice::If ghcr.io/${{ github.repository_owner }}/symbol-rest is still PRIVATE,"
          echo "::notice::set it to Public once in the package settings (the org must also allow public packages);"
          echo "::notice::later releases stay public automatically."

  # Create the GitHub Release (first publish) or add this build's row to it (security
  # rebuild). The ONLY job with `contents: write`, and it runs no build and no third-party
  # code — just .github/scripts/image-release.sh and the gh CLI, taken from the commit the
  # workflow itself runs from (github.sha), never from the released tree. Same split as the
  # tag job in publish.yml: the publish job never sees a write token for the repo.
  release:
    needs: publish
    # A publish that could not read its digest still reaches the script, which fails
    # loudly instead of silently leaving the image without a Release.
    if: needs.publish.outputs.dated != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/image-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: rest
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          DATED_TAG: ${{ needs.publish.outputs.dated }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VCS_REF: ${{ needs.publish.outputs.vcs_ref }}
          BUILD_KIND: ${{ needs.publish.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/image-release.sh
