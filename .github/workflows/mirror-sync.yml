name: mirror-sync (upstream symbol/symbol)

# Tracks upstream symbol/symbol@dev WITHOUT force-pushing dev.
# Each run merges new upstream commits into a fresh sync branch, re-applies the
# @nemtus rename layer, and opens a pull request into dev. A human (or auto-merge)
# reviews and merges it; publishing then happens via publish.yml when the merged
# package.json version differs from npm.
#
# IMPORTANT: merge these sync PRs with a MERGE COMMIT (never "Squash and merge").
# The sync branch carries upstream/dev as a parent; squashing would drop that
# parent, leaving upstream/dev out of dev's ancestry again and making every run
# replay the entire upstream history as a giant diff.
#
# The "build and decide" step below is CONTENT-based: it builds the merged +
# re-renamed tree and only opens a PR when that tree actually differs from dev.
# This is robust even if dev's ancestry is ever disconnected from upstream/dev.
#
# Requires repo setting: Settings -> Actions -> General ->
#   "Allow GitHub Actions to create and approve pull requests" = enabled.
#
# Companion jobs:
#   - `keepalive` resets GitHub's 60-day scheduled-workflow auto-disable clock on
#     every run. To stop a schedule permanently, DELETE its cron trigger — a manual
#     "disable workflow" would just be re-enabled by the next keepalive.
#   - `notify` pings Discord (org secret DISCORD_WEBHOOK_URL) when a scheduled run
#     fails; it skips silently when the secret is not configured.

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the sync branch
      pull-requests: write   # open the PR
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Fetch upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/symbol/symbol.git
          # --no-tags: keep implicit tag auto-following out of refs/tags; upstream
          # tags are archived explicitly by the upstream-tags job below.
          git fetch --no-tags upstream dev

      - name: Build sync branch and decide (content-based)
        id: check
        run: |
          # Fast path: if dev already contains every upstream commit, stop early.
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "dev already contains upstream/dev; nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_sha="$(git rev-parse --short upstream/dev)"
          branch="sync/upstream-${upstream_sha}"
          git checkout -B "${branch}"
          # Prefer upstream on any conflict; the rename layer is restored next.
          git merge -X theirs --no-edit --no-commit upstream/dev || true
          bash .github/scripts/apply-nemtus-patch.sh
          git add -A

          # Content guard: if the merged + re-renamed tree is identical to dev,
          # there is nothing to sync even though ancestry differs. Don't open a
          # noise PR — abort the in-progress merge and return to dev.
          if git diff --cached --quiet; then
            echo "merged tree == dev; nothing to sync."
            git merge --abort 2>/dev/null || git reset --hard HEAD
            git checkout dev
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-edit -m "chore: sync upstream ${upstream_sha} + nemtus republish layer"
          echo "SYNC_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch and open PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -u origin "${SYNC_BRANCH}" --force-with-lease
          open_count="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${SYNC_BRANCH}" --state open --json number --jq 'length')"
          if [ "${open_count}" != "0" ]; then
            echo "PR already open for ${SYNC_BRANCH}."
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base dev --head "${SYNC_BRANCH}" \
              --title "Sync upstream symbol/symbol@${{ steps.check.outputs.upstream_sha }}" \
              --body "Automated mirror sync. Merges upstream symbol/symbol@dev and re-applies the @nemtus/symbol-sdk rename layer. After merge, publish.yml publishes if the version changed."
          fi

  # Reset GitHub's 60-day scheduled-workflow auto-disable clock on every run
  # (scheduled workflows in repos with no recent activity get disabled; upstream
  # can be quiet for long stretches). Independent of the sync outcome.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows (60-day inactivity guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in mirror-sync.yml upstream-release-watch.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
          done

  # Verify the upstream tag archive (refs/upstream/tags/* on this fork) against
  # upstream — VERIFY-ONLY, no push. GITHUB_TOKEN cannot create refs whose trees
  # contain workflow files (GitHub demands a `workflows` permission that is not
  # grantable to GITHUB_TOKEN), and most upstream tags contain upstream's own
  # .github/workflows/* — so the archive itself is pushed from the maintainer
  # lane instead (`nemtus-ops sync-local`; see RELEASE.md "Upstream tag archive").
  # This job keeps the tamper alarm: a MOVED tag (archived value != upstream
  # value) fails the run, and notify pages Discord. Pure ls-remote comparison:
  # no checkout, no object download, no credentials.
  upstream-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify archived upstream tags (tamper alarm)
        run: |
          set -euo pipefail
          # "name<TAB>sha" per tag, peeled ^{} rows excluded (both sides store
          # the same tag *object* ids, so comparing un-peeled ids is exact).
          # The peeled-row filter lives INSIDE awk: a separate `grep -v` exits 1
          # on empty ls-remote output and, under pipefail, would abort the step
          # before the explicit empty-input handling below (empty upstream ->
          # ::error; empty archive -> "not yet archived" reporting).
          git ls-remote https://github.com/symbol/symbol.git 'refs/tags/*' \
            | awk -F'\t' '$2 !~ /\^[{][}]$/ {sub("^refs/tags/","",$2); print $2 "\t" $1}' | sort > upstream.txt
          git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 'refs/upstream/tags/*' \
            | awk -F'\t' '$2 !~ /\^[{][}]$/ {sub("^refs/upstream/tags/","",$2); print $2 "\t" $1}' | sort > archive.txt
          # Fail closed on an empty upstream listing (network anomaly, not "no tags").
          [ -s upstream.txt ] || { echo "::error::empty upstream tag list (network anomaly?)"; exit 1; }

          moved="$(join -t "$(printf '\t')" upstream.txt archive.txt | awk -F'\t' '$2 != $3')"
          missing="$(join -t "$(printf '\t')" -v1 upstream.txt archive.txt | cut -f1)"
          retained="$(join -t "$(printf '\t')" -v2 upstream.txt archive.txt | cut -f1)"

          {
            echo "## upstream tag archive check"
            echo "- upstream tags: $(wc -l < upstream.txt) / archived on fork: $(wc -l < archive.txt)"
            if [ -n "${missing}" ]; then
              echo "- NOT YET ARCHIVED ($(printf '%s\n' "${missing}" | wc -l)) — run \`nemtus-ops sync-local\` on the maintainer machine:"
              printf '%s\n' "${missing}" | sed 's/^/    - /'
            fi
            if [ -n "${retained}" ]; then
              echo "- retained after upstream deletion (DR posture): $(printf '%s\n' "${retained}" | wc -l)"
            fi
            if [ -n "${moved}" ]; then
              echo "- MOVED (TAMPER ALARM):"
              printf '%s\n' "${moved}" | sed 's/^/    - /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${moved}" ]; then
            echo "::error::upstream tag(s) moved vs the archived values — possible history rewrite. Investigate upstream intent before re-archiving (see RELEASE.md)."
            printf '%s\n' "${moved}"
            exit 1
          fi
          [ -n "${missing}" ] && echo "note: new upstream tag(s) await archiving from the maintainer lane." || echo "archive complete and value-exact."

  # Push-notification on failure — a red scheduled run used to be the only signal.
  # Covers BOTH the sync job and the upstream-tags tamper alarm. No third-party
  # action: plain curl to a Discord webhook. Details stay in the run's step
  # summary/logs; this is just the pager.
  notify:
    needs: [sync, upstream-tags]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Discord (mirror-sync failed)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping notification."
            exit 0
          fi
          payload="$(jq -n --arg c "[mirror-sync] ${GITHUB_REPOSITORY} failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{content: $c}')"
          # --retry handles transient Discord 429/5xx (honors Retry-After).
          curl -fsS --retry 3 -H 'Content-Type: application/json' -d "${payload}" "${WEBHOOK}"
